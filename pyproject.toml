[project]
name = "capricorn"
version = "0.2.0"
description = "Капри — голосовой ассистент для Windows"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
src = ["src"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
